<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>论文重写 Agent</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
      .app { display: flex; height: 100vh; }
      .sidebar { width: 240px; background: #161b22; border-right: 1px solid #30363d; padding: 16px; overflow-y: auto; }
      .sidebar h2 { font-size: 14px; color: #8b949e; margin-bottom: 12px; }
      .sidebar button { width: 100%; padding: 8px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }
      .sidebar button:hover { background: #30363d; }
      .main { flex: 1; display: flex; flex-direction: column; }
      .header { padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 16px; }
      .header h1 { font-size: 18px; }
      .chat-area { flex: 1; overflow-y: auto; padding: 24px; }
      .msg { margin-bottom: 16px; max-width: 80%; }
      .msg.user { margin-left: auto; background: #1f6feb22; border: 1px solid #1f6feb44; padding: 10px 14px; border-radius: 12px 12px 2px 12px; }
      .msg.assistant { margin-right: auto; background: #161b22; border: 1px solid #30363d; padding: 10px 14px; border-radius: 12px 12px 12px 2px; }
      .msg.tool { margin-right: auto; background: #1a1a2a; border: 1px solid #30363d; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #8b949e; }
      .input-area { padding: 16px 24px; border-top: 1px solid #30363d; display: flex; gap: 12px; }
      .input-area input { flex: 1; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 8px; font-size: 14px; }
      .input-area input:focus { outline: none; border-color: #58a6ff; }
      .input-area button { padding: 10px 20px; background: #238636; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .input-area button:hover { background: #2ea043; }
      .input-area button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
      .status { font-size: 12px; color: #8b949e; padding: 8px 24px; border-top: 1px solid #30363d; }
      .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .thinking { color: #8b949e; font-style: italic; font-size: 13px; padding: 4px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState('');
        const [isStreaming, setIsStreaming] = useState(false);
        const [streamContent, setStreamContent] = useState('');
        const [toolCalls, setToolCalls] = useState([]);
        const messagesEndRef = useRef(null);
        const scrollContainerRef = useRef(null);

        // Generate unique thread/run IDs
        const threadId = useRef('thread_' + Math.random().toString(36).substr(2, 9));
        const runId = useRef('run_' + Math.random().toString(36).substr(2, 9));
        const AGUI_URL = `${window.location.origin}/api/copilotkit`;

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, streamContent]);

        const addMessage = (role, content, toolName = '') => {
          setMessages(prev => [...prev, { id: Date.now() + Math.random(), role, content, toolName, timestamp: Date.now() }]);
        };

        const sendMessage = async () => {
          if (!input.trim() || isStreaming) return;
          const userMsg = input.trim();
          setInput('');
          addMessage('user', userMsg);
          setIsStreaming(true);
          setStreamContent('');
          setToolCalls([]);
          // New run ID for each message
          runId.current = 'run_' + Math.random().toString(36).substr(2, 9);

          try {
            const resp = await fetch(AGUI_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                threadId: threadId.current,
                runId: runId.current,
                messages: [{ id: 'msg_' + Date.now(), role: 'user', content: userMsg }],
                state: {},
                tools: [],
                context: [],
                forwardedProps: {},
              }),
            });

            if (!resp.ok) {
              const errText = await resp.text();
              addMessage('assistant', `请求失败 (${resp.status}): ${errText.substring(0, 200)}`);
              setIsStreaming(false);
              return;
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let assistantContent = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                if (!line.trim()) continue;
                try {
                  const data = JSON.parse(line);
                  if ((data.type === 'TEXT_MESSAGE_CONTENT' || data.type === 'TEXT_MESSAGE_CHUNK') && data.delta) {
                    setStreamContent(prev => prev + data.delta);
                    assistantContent += data.delta;
                  } else if (data.type === 'TOOL_CALL_START' && data.name) {
                    setToolCalls(prev => [...prev, { name: data.name, status: 'running' }]);
                  } else if (data.type === 'TOOL_CALL_END') {
                    setToolCalls(prev => prev.map((t, i) => i === prev.length - 1 ? { ...t, status: 'done' } : t));
                  } else if (data.type === 'RUN_FINISHED' || data.type === 'RUN_ERROR') {
                    // end of stream
                  }
                } catch (e) { /* skip non-JSON lines */ }
              }
            }

            if (assistantContent) {
              addMessage('assistant', assistantContent);
            } else if (!streamContent) {
              addMessage('assistant', '(空响应)');
            }
          } catch (e) {
            addMessage('assistant', `错误: ${e.message}`);
          } finally {
            setIsStreaming(false);
            setStreamContent('');
          }
        };

        return (
          <div className="app">
            <div className="sidebar">
              <h2>📝 论文重写</h2>
              <button onClick={() => { setMessages([]); threadId.current = 'thread_' + Math.random().toString(36).substr(2, 9); runId.current = 'run_' + Math.random().toString(36).substr(2, 9); }}>✨ 新对话</button>
              <div style={{ fontSize: 12, color: '#484f58', marginTop: 16 }}>
                <p>基于 LangGraph + Agnes AI</p>
                <p style={{ marginTop: 4 }}>模型: agnes-2.5-flash</p>
              </div>
            </div>
            <div className="main">
              <div className="header">
                <h1>📄 论文重写 Agent</h1>
              </div>
              <div className="chat-area" ref={scrollContainerRef}>
                {messages.length === 0 && (
                  <div style={{ textAlign: 'center', color: '#484f58', marginTop: 80 }}>
                    <div style={{ fontSize: 48, marginBottom: 16 }}>📝</div>
                    <p>输入论文标题和内容，AI 会帮你重写为通俗易懂的中文科普文章</p>
                    <p style={{ marginTop: 8, fontSize: 13 }}>目标读者：大一非理工科学生</p>
                  </div>
                )}
                {messages.map(m => (
                  <div key={m.id} className={`msg ${m.role}`}>
                    {m.toolName && <div style={{ fontSize: 11, color: '#58a6ff', marginBottom: 4 }}>🔧 {m.toolName}</div>}
                    <div style={{ whiteSpace: 'pre-wrap' }}>{m.content}</div>
                  </div>
                ))}
                {isStreaming && streamContent && (
                  <div className="msg assistant">
                    <div style={{ whiteSpace: 'pre-wrap' }}>{streamContent}</div>
                  </div>
                )}
                {isStreaming && !streamContent && (
                  <div className="msg assistant">
                    <span className="loading"></span> <span className="thinking">正在思考...</span>
                  </div>
                )}
                {toolCalls.map((t, i) => (
                  <div key={i} className="msg tool">
                    {t.status === 'running' ? <span className="loading"></span> : '✓'} {t.name}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>
              <div className="input-area">
                <input
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && sendMessage()}
                  placeholder="输入论文信息或问题..."
                  disabled={isStreaming}
                />
                <button onClick={sendMessage} disabled={isStreaming}>
                  {isStreaming ? <span className="loading"></span> : '发送'}
                </button>
              </div>
              <div className="status">
                {isStreaming ? '⏳ 处理中...' : '✅ 就绪 (agnes-2.5-flash)'}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
